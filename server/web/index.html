<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보난자</title>
<style>
  :root {
    --bg: #f4efe6; --panel: #fffdf8; --ink: #2b2119; --muted: #8a7d6b;
    --line: #e2d8c6; --accent: #b5651d; --accent2: #7a9e5e; --shadow: rgba(60,40,20,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
  }
  header {
    padding: 12px 18px; background: var(--accent); color: #fff;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  header .sub { font-size: 13px; opacity: .9; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 3px var(--shadow);
  }
  label { font-size: 14px; color: var(--muted); margin-right: 6px; }
  input, button, select {
    font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink);
  }
  input { width: 90px; }
  button {
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    transition: filter .1s; margin: 3px 4px 3px 0;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: #efe7d8; color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .players { display: grid; gap: 10px; }
  .player {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff;
  }
  .player.you { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(122,158,94,.25); }
  .player.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(181,101,29,.3); }
  .pname { font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .pname .tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 20px; color: #fff; }
  .tag.you { background: var(--accent2); }
  .tag.turn { background: var(--accent); }
  .tag.bot { background: var(--muted); }
  .fields { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .field {
    min-width: 62px; text-align: center; padding: 6px 4px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px;
  }
  .field.empty { border-style: dashed; color: var(--muted); background: #faf7f0; }
  .field .cnt { font-weight: 700; font-size: 16px; }
  .field .coin { font-size: 12px; font-weight: 700; }
  .field .next { font-size: 10px; opacity: .7; white-space: nowrap; }
  table.meter { border-collapse: collapse; font-size: 13px; width: 100%; }
  table.meter th, table.meter td { border: 1px solid var(--line); padding: 4px 8px; text-align: center; }
  table.meter th:first-child, table.meter td:first-child { text-align: left; }
  #meterCard summary { cursor: pointer; font-weight: 700; font-size: 15px; }
  .beans { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .bean {
    padding: 3px 9px; border-radius: 16px; font-size: 13px; color: #1c1c1c;
    border: 1px solid rgba(0,0,0,.12); white-space: nowrap;
  }
  .bean .idx { opacity: .55; font-size: 11px; margin-right: 3px; }
  .hand .bean:first-child { outline: 2px solid var(--accent); outline-offset: 1px; }
  .acts button { display: inline-block; }
  .pending { background: #fff4e0; border: 1px solid #e9c27a; border-radius: 10px; padding: 10px 12px; }
  .log { font-size: 13px; color: var(--muted); max-height: 140px; overflow-y: auto; }
  .log div { padding: 1px 0; }
  /* 이제 이벤트가 갈래를 아는 값이라, 눈에 띄어야 할 것만 도드라지게 할 수 있다. */
  .log .ev-tradeProposed, .log .ev-tradeAccepted { color: var(--accent); }
  .log .ev-harvested { color: var(--accent2); }
  .log .ev-offered { color: var(--accent); }
  .log .ev-tossed, .log .ev-fished { opacity: .75; }
  .log .ev-deckEmptied { color: var(--accent); font-weight: 600; }
  .log .mine { font-weight: 600; }
  .chat { max-height: 170px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
  .chat .msg { padding: 1px 0; }
  .chat .who { font-weight: 700; margin-right: 6px; }
  .chat .msg.me .who { color: var(--accent2); }
  .chat .empty { color: var(--muted); font-size: 13px; }
  #chatText { flex: 1; width: auto; min-width: 0; }
  #chatCard { display: flex; flex-direction: column; }
  /* 넓은 화면: 콩미터표는 왼쪽 여백, 채팅은 오른쪽 여백, 둘 다 맨 위에 고정. */
  @media (min-width: 1340px) {
    #meterCard {
      position: fixed; top: 70px; left: 12px; right: calc(50% + 462px);
      margin: 0; z-index: 5; max-height: calc(100vh - 84px); overflow-y: auto;
    }
    #chatCard {
      position: fixed; top: 70px; left: calc(50% + 462px); right: 12px; margin: 0; z-index: 5;
    }
    /* 채팅 로그: 처음엔 짧게, 쌓일수록 늘어나다 화면을 넘으면 스크롤. */
    #chatCard .chat { min-height: 48px; max-height: calc(100vh - 190px); flex: 0 1 auto; }
  }
  .muted { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .err { color: #b00020; font-size: 13px; min-height: 18px; }
  .win { font-size: 17px; font-weight: 700; color: var(--accent); }
  .bean.click { cursor: pointer; }
  .bean.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .builder .grp { margin: 10px 0; }
  .builder .lab { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .basket { min-height: 26px; }
  .hide { display: none; }
</style>
</head>
<body>
<header>
  <h1>🫘 보난자</h1>
  <span class="sub" id="hdrInfo">콩 농사 · 웹 클라이언트</span>
</header>
<main>
  <!-- 로비 -->
  <section class="card" id="lobby">
    <h2>게임 시작</h2>
    <div class="row" style="margin-bottom:10px">
      <label>내 이름</label><input id="playerName" type="text" style="width:140px" placeholder="예: 콩부자" maxlength="20">
    </div>
    <div class="row" style="margin-bottom:10px">
      <label>인원</label><input id="players" type="number" min="2" max="4" value="3">
      <label>봇</label><input id="bots" type="number" min="0" max="3" value="0">
      <label>씨앗(선택)</label><input id="seed" type="text" placeholder="비우면 무작위">
      <button id="btnNew">새 게임 만들기</button>
    </div>
    <div class="row">
      <label>방 코드</label>
      <input id="joinCode" type="text" style="width:120px; text-transform:uppercase" placeholder="예: K7QP" maxlength="4">
      <button class="ghost" id="btnJoin">참가</button>
    </div>
    <div class="err" id="lobbyErr"></div>
    <div id="resumeBox" class="hide" style="margin-top:8px"></div>
    <p class="muted" id="shareBox"></p>
  </section>

  <!-- 게임판 -->
  <section id="game" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><strong id="phase"></strong> · <span id="turn" class="muted"></span></div>
        <div class="muted">덱 <span id="deck"></span>장 · 버림 <span id="discard"></span>장</div>
      </div>
      <div id="faceupBox" class="row hide" style="margin-top:8px">
        <span class="muted" id="faceupLab">공개 카드:</span><div class="beans" id="faceup"></div>
      </div>
    </div>

    <div id="pendingBox" class="card pending hide"></div>

    <div class="card">
      <h2>내 손패 <span class="muted" style="font-weight:400">(맨 앞 = 다음에 심을 카드)</span></h2>
      <div class="beans hand" id="hand"></div>
      <div id="acquiredBox" class="hide" style="margin-top:8px">
        <span class="muted">받은 콩:</span><div class="beans" id="acquired"></div>
      </div>
    </div>

    <div class="card" id="actionsCard">
      <h2>둘 수 있는 수</h2>
      <div class="acts" id="actions"></div>
      <div class="err" id="actErr"></div>
    </div>

    <div class="card builder hide" id="builderCard">
      <h2>거래 만들기 <span class="muted" style="font-weight:400">(여러 장 자유롭게)</span></h2>
      <div class="grp row"><label>상대</label><select id="tradeTo"></select></div>
      <div class="grp">
        <div class="lab">내가 줄 카드 — 손패/공개 카드를 눌러 고르기 (점선 = 공개 카드)</div>
        <div class="beans" id="giveOpts"></div>
      </div>
      <div class="grp">
        <div class="lab">내가 받을 콩 — 종류를 눌러 담기 (여러 번 누르면 여러 장)</div>
        <div class="beans" id="getOpts"></div>
        <div class="lab" style="margin-top:6px">요청 바구니 (눌러서 빼기):</div>
        <div class="beans basket" id="getBasket"></div>
      </div>
      <button id="btnPropose">제안 보내기</button>
      <button class="ghost" id="btnClearTrade">비우기</button>
      <div class="err" id="buildErr"></div>
    </div>

    <details class="card" id="meterCard">
      <summary>콩미터 표 — 몇 장에 몇 코인인가</summary>
      <div style="overflow-x:auto; margin-top:8px" id="meterTable"></div>
    </details>

    <div class="card" id="chatCard">
      <h2>채팅 <span class="muted" style="font-weight:400">(거래 흥정 · 매 턴 초기화)</span></h2>
      <div class="chat" id="chatLog"></div>
      <div class="row" style="margin-top:8px">
        <input id="chatText" type="text" placeholder="메시지 입력 후 Enter" maxlength="300">
        <button id="btnChat">보내기</button>
      </div>
    </div>

    <div class="card">
      <h2>플레이어</h2>
      <div class="players" id="players_"></div>
    </div>

    <div class="card">
      <h2>진행 기록</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<script>
"use strict";
// 콩 색 팔레트 (도감 순서: 커피~카카오)
const PALETTE = ["#c9a27a","#f0e2b0","#9fc0e8","#e79a86","#c7d59a",
  "#a9d6a0","#d8cf9a","#d9c2a0","#e59aa0","#bfe0b8","#b98a6a"];
let CAT = [];              // 콩 도감
let gid = null, me = null; // 방 코드, 내 자리 번호
let token = null;          // 내 자리의 비밀 토큰
let es = null;             // EventSource
const SKEY = "bohnanza_session"; // localStorage 열쇠
let VIEW = null;           // 마지막으로 받은 내 뷰
let BOTS = [];             // BOTS[p]가 참이면 p번은 봇
let NAMES = [];            // NAMES[p] = p번 자리의 표시 이름
let lastChatSeq = 0;       // 마지막으로 본 채팅 순번(재접속 중복 걸러내기)
let chatTurn = null;       // 채팅이 매인 턴(활성 플레이어). 바뀌면 채팅을 비운다
let builderKey = null;     // 거래 빌더 맥락 열쇠(바뀌면 선택 초기화)
let sel = { to: null, giveHand: new Set(), giveFace: new Set(), get: [] };

const $ = (id) => document.getElementById(id);
const beanName = (b) => (CAT[b] ? CAT[b].name : "콩" + b);
const beanColor = (b) => PALETTE[b % PALETTE.length];
const isBot = (i) => !!BOTS[i];
const pName = (i) => NAMES[i] || (i + "번");

// 콩미터 셈: 콩 n장이면 몇 코인인가(엔진의 Bean.Coins를 JS로 옮긴 것).
function coinsFor(b, n) {
  const m = CAT[b] ? CAT[b].meter : [0, 0, 0, 0];
  let c = 0;
  m.forEach((need, i) => { if (need && n >= need) c = i + 1; });
  return c;
}
// 다음 코인 칸까지 몇 장 더 필요한가. 이미 최대치면 null.
function nextTier(b, n) {
  const m = CAT[b] ? CAT[b].meter : [0, 0, 0, 0];
  for (let i = 0; i < 4; i++) if (m[i] && n < m[i]) return { need: m[i] - n, coins: i + 1 };
  return null;
}
// 콩 하나의 콩미터를 한 줄 글로: "커피콩 콩미터: 4장→1 · 7장→2 · …".
function meterText(b) {
  const m = CAT[b] ? CAT[b].meter : null;
  if (!m) return beanName(b);
  const parts = [];
  m.forEach((need, i) => { if (need) parts.push(`${need}장→${i + 1}코인`); });
  return `${beanName(b)} 콩미터: ${parts.join(" · ")}`;
}

// 콩 하나를 색 알약으로. idx가 있으면 앞에 번호를 붙인다. 콩미터를 툴팁으로 단다.
function beanPill(b, idx) {
  const s = document.createElement("span");
  s.className = "bean";
  s.style.background = beanColor(b);
  s.title = meterText(b);
  s.innerHTML = (idx != null ? `<span class="idx">${idx}</span>` : "") + beanName(b);
  return s;
}

// 액션 하나를 사람이 읽을 이름으로. 엔진의 Action.String()을 JS로 옮긴 것.
function actionLabel(a) {
  const names = (arr) => (arr && arr.length ? arr.map(beanName).join(",") : "없음");
  switch (a.kind) {
    case 0: return `맨 앞 카드를 밭 ${a.field}에 심기`;
    case 1: return `밭 ${a.field} 거두기`;
    case 2: return "세 번째 밭 사기 (코인 3)";
    case 3: return "이 단계 끝내기";
    case 4: return `공개 카드 ${a.card}을(를) 밭 ${a.field}에 심기`;
    case 5: {
      const give = [].concat(a.giveHand || [], a.giveFaceUp || []);
      return `${a.to}번에게 [${names(give)}] 주고 [${names(a.getHand)}] 받기`;
    }
    case 6: return a.accept ? "제안 수락" : "제안 거절";
    case 7: return `받은 콩을 밭 ${a.field}에 심기`;
    case 8: return `공개 카드 ${a.card} 버리기`;
    case 9: return `손패 ${a.hand}번 버리기`;
  }
  return "알 수 없는 수";
}

async function createGame() {
  $("lobbyErr").textContent = "";
  const p = $("players").value || "3";
  const bots = $("bots").value || "0";
  const seed = $("seed").value.trim();
  let url = `games?players=${encodeURIComponent(p)}&bots=${encodeURIComponent(bots)}`;
  if (seed) url += `&seed=${encodeURIComponent(seed)}`;
  try {
    const r = await fetch(url, { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    // 방을 만든 사람도 참가해 자리를 잡는다(대개 0번).
    await joinRoom(d.code);
  } catch (e) { $("lobbyErr").textContent = "" + e; }
}

async function joinRoom(code) {
  $("lobbyErr").textContent = "";
  try {
    const name = $("playerName").value.trim();
    const r = await fetch(`games/${code}/join?name=${encodeURIComponent(name)}`, { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    startSession(code, d.player, d.token);
  } catch (e) { $("lobbyErr").textContent = "" + e; }
}

// 토큰은 URL에 싣지 않는다. 액션·뷰는 Authorization 머리글로, SSE는 이 쿠키로
// 보낸다(EventSource가 머리글을 못 실어서). 같은 출처라 EventSource가 쿠키를 자동 전송.
function setAuthCookie(tok) { document.cookie = `bz_token=${tok}; path=/; samesite=strict`; }
function clearAuthCookie() { document.cookie = "bz_token=; path=/; max-age=0; samesite=strict"; }

// 자리·토큰을 받아 세션을 시작한다. 토큰을 저장해 새로고침 뒤에도 이어 붙는다.
function startSession(code, player, tok) {
  gid = code; me = player; token = tok;
  setAuthCookie(tok);
  localStorage.setItem(SKEY, JSON.stringify({ code, player, token: tok }));
  $("lobby").classList.add("hide");
  $("game").classList.remove("hide");
  $("hdrInfo").textContent = `방 ${code} · 나는 ${player}번 (친구에게 방 코드 ${code} 공유)`;
  connect();
}

function connect() {
  if (es) es.close();
  lastChatSeq = 0; chatTurn = null; $("chatLog").innerHTML = ""; // 새 세션: 이력을 처음부터
  es = new EventSource("stream"); // 토큰은 bz_token 쿠키로 실려 간다
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.bots) BOTS = msg.bots;
    if (msg.names) NAMES = msg.names;
    render(msg.view);
    logEvents(msg.events);
  };
  es.addEventListener("chat", (ev) => addChat(JSON.parse(ev.data)));
  es.onerror = () => { $("turn").textContent = "(연결 끊김, 재시도 중…)"; };
}

// 채팅 한 줄을 그린다. 이미 본 순번(재접속 재생 등)은 건너뛴다. 사용자 글은
// textContent로만 넣어 HTML 주입을 막는다.
function addChat(m) {
  if (m.seq <= lastChatSeq) return;
  lastChatSeq = m.seq;
  const box = $("chatLog");
  const d = document.createElement("div");
  d.className = "msg" + (m.from === me ? " me" : "");
  const who = document.createElement("span");
  who.className = "who"; who.textContent = pName(m.from) + ":";
  const t = document.createElement("span");
  t.textContent = m.text;
  d.appendChild(who); d.appendChild(t);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const el = $("chatText");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  try {
    await fetch("chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ text }),
    });
  } catch (e) { /* 조용히 무시: 다음 입력에서 다시 시도 */ }
}

async function send(action) {
  $("actErr").textContent = "";
  try {
    const r = await fetch("action", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(action),
    });
    if (!r.ok) throw new Error(await r.text());
    // 성공하면 SSE가 곧 새 뷰를 밀어 준다.
  } catch (e) { $("actErr").textContent = "" + e; }
}

// 조사는 앞말 받침을 따라 갈린다. 한글 음절은 0xAC00부터 28개씩 묶여, 그
// 나머지가 0이면 받침이 없다. 이름이 숫자로 끝나면("봇 1") 읽는 소리로 따진다.
const DIGIT_FINAL = [true, true, false, true, false, false, true, true, true, false];
function hasFinal(s) {
  if (!s) return false;
  const ch = s[s.length - 1];
  if (ch >= "0" && ch <= "9") return DIGIT_FINAL[+ch];
  const c = s.codePointAt(s.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return false; // 한글 음절이 아니다
  return (c - 0xac00) % 28 !== 0;
}
const objP = (s) => (hasFinal(s) ? "을" : "를");
const subP = (s) => (hasFinal(s) ? "이" : "가");
const withP = (s) => (hasFinal(s) ? "과" : "와");
const beanList = (a) => (a && a.length ? a.map(beanName).join(",") : "없음");

// 구조적 이벤트를 문장으로 그린다. 엔진은 자리 번호밖에 모르지만 여기서는
// 참가자 이름을 알고 있으므로, 이름으로 적고 조사도 이름에 맞춰 고른다.
function eventText(e) {
  const who = pName(e.actor), crop = beanName(e.bean);
  switch (e.kind) {
    case "planted":
      return `${who}${subP(who)} ${crop}${objP(crop)} ${e.field}번 밭에 심음`;
    case "plantedFaceUp":
      return `${who}${subP(who)} 공개된 ${crop}${objP(crop)} ${e.field}번 밭에 심음`;
    case "plantedGift":
      return `${who}${subP(who)} 받은 ${crop}${objP(crop)} ${e.field}번 밭에 심음`;
    case "harvested":
      return `${who}${subP(who)} ${crop} 밭을 거둬 코인 ${e.coins}개 얻음`;
    case "boughtField": return `${who}${subP(who)} 세 번째 밭을 삼`;
    case "revealed":    return `공개 카드로 ${crop}${subP(crop)} 뒤집힘`;
    case "deckEmptied": return "덱이 바닥나 게임이 끝남";
    case "giftStage":   return "받은 콩을 심는 단계로";
    case "turnPassed":  return "턴을 넘김";
    case "tradeProposed":
      return `${who}${subP(who)} ${pName(e.to)}에게 `
        + `[${beanList(e.give)}] 주고 [${beanList(e.get)}] 받기를 제안`;
    case "tradeRejected": return `${who}${subP(who)} 제안을 거절`;
    case "tradeAccepted":
      return `${who}${subP(who)} ${pName(e.to)}${withP(pName(e.to))} `
        + `[${beanList(e.give)}] 주고 [${beanList(e.get)}] 받아 교환 성사`;
    // 아래 셋은 2인 콩 결투에만 나온다.
    case "tossed":  return `${who}${subP(who)} ${crop}${objP(crop)} 버림`;
    case "offered":
      return `${who}${subP(who)} ${pName(e.to)}에게 [${beanList(e.give)}] 남김`;
    case "fished":  return `버림 더미에서 ${crop}${subP(crop)} 딸려 올라옴`;
  }
  return e.kind; // 모르는 갈래는 이름만 적어 둔다
}

function logEvents(events) {
  if (!events) return;
  const log = $("log");
  for (const e of events) {
    const d = document.createElement("div");
    d.className = "ev ev-" + e.kind;
    if (e.actor === me) d.classList.add("mine");
    d.textContent = "· " + eventText(e); // 이름이 섞이므로 textContent로 넣는다
    log.prepend(d);
  }
}

function render(v) {
  VIEW = v;
  $("hdrInfo").textContent = `방 ${gid} · 나는 ${pName(me)} · 방 코드 ${gid} 공유`;
  if (v.active !== chatTurn) { chatTurn = v.active; $("chatLog").innerHTML = ""; } // 새 턴: 채팅 비움
  $("phase").textContent = v.over ? "게임 종료" : v.phaseName + " 단계";
  $("turn").textContent = v.over ? ""
    : v.toAct === me ? "★ 당신 차례입니다"
    : isBot(v.toAct) ? `${pName(v.toAct)}이 두는 중…`
    : `${v.toAct}번 차례`;
  $("deck").textContent = v.deckCount;
  $("discard").textContent = v.discardCount;
  renderFaceUp(v);
  renderPending(v);
  renderMe(v);
  renderActions(v);
  renderBuilder(v);
  renderPlayers(v);
  if (v.over) renderScores(v);
}

// 상 위의 더미는 단계마다 뜻이 다르다. 결투에서는 같은 자리가 "상대가 남긴
// 콩"이었다가 "내가 뽑은 콩"이 되므로, 이름표를 단계에 맞춰 갈아 준다.
const FACEUP_LAB = {
  "받은 제안": "상대가 남긴 콩:",
  "뽑아 나누기": "뽑은 콩 — 안 가져가면 상대에게 넘어감:",
};

function renderFaceUp(v) {
  const box = $("faceupBox"), fu = $("faceup");
  fu.innerHTML = "";
  $("faceupLab").textContent = FACEUP_LAB[v.phaseName] || "공개 카드:";
  if (v.faceUp && v.faceUp.length) {
    box.classList.remove("hide");
    v.faceUp.forEach((b, i) => fu.appendChild(beanPill(b, i)));
  } else box.classList.add("hide");
}

function renderPending(v) {
  const box = $("pendingBox");
  if (!v.pending) { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  const pr = v.pending;
  const give = [].concat(pr.giveHand || [], pr.giveFaceUp || []).map(beanName).join(",") || "없음";
  const get = (pr.getHand || []).map(beanName).join(",") || "없음";
  const mine = v.toAct === me && pr.to === me;
  box.innerHTML = `<strong>거래 제안</strong> — ${pName(pr.from)}이(가) [${give}] 주고 ${pName(pr.to)}의 [${get}]을(를) 원함.`
    + (mine ? " <em>수락/거절하세요.</em>" : "");
}

function renderMe(v) {
  const meP = v.players[me];
  const hand = $("hand"); hand.innerHTML = "";
  (meP.hand || []).forEach((b, i) => hand.appendChild(beanPill(b, i)));
  if (!meP.hand || !meP.hand.length)
    hand.innerHTML = '<span class="muted">손패가 없습니다</span>';
  const abox = $("acquiredBox"), acq = $("acquired"); acq.innerHTML = "";
  if (meP.acquired && meP.acquired.length) {
    abox.classList.remove("hide");
    meP.acquired.forEach((b) => acq.appendChild(beanPill(b)));
  } else abox.classList.add("hide");
}

// 요청받은 콩(want)을 내 손패(hand)로 다 내줄 수 있는지 다중집합 검사.
function canFulfill(hand, want) {
  const cnt = {};
  hand.forEach((b) => (cnt[b] = (cnt[b] || 0) + 1));
  for (const b of (want || [])) { if (!cnt[b]) return false; cnt[b]--; }
  return true;
}

function renderActions(v) {
  const box = $("actions"); box.innerHTML = "";
  if (v.over) { box.innerHTML = '<span class="muted">게임이 끝났습니다.</span>'; return; }
  if (v.toAct !== me) {
    box.innerHTML = '<span class="muted">다른 플레이어의 차례를 기다리는 중…</span>';
    return;
  }
  // 거래 제안(kind 5)은 아래 "거래 만들기"에서 자유롭게 짜므로 버튼에서 뺀다.
  const acts = (v.legal || []).filter((a) => a.kind !== 5);
  if (!acts.length) {
    box.innerHTML = '<span class="muted">버튼으로 둘 수는 없습니다. 아래 거래를 이용하세요.</span>';
    return;
  }
  const fulfill = v.pending ? canFulfill(v.players[me].hand || [], v.pending.getHand) : true;
  acts.forEach((a) => {
    const btn = document.createElement("button");
    if (a.kind === 3 || a.kind === 6) btn.className = "ghost";
    btn.textContent = actionLabel(a);
    if (a.kind === 6 && a.accept && !fulfill) {
      btn.disabled = true; btn.title = "요청받은 콩이 손패에 없어 수락할 수 없습니다";
    }
    btn.onclick = () => send(a);
    box.appendChild(btn);
  });
}

// 거래 빌더: 내 차례의 거래 단계이고 대기 중인 제안이 없을 때만 보인다.
function renderBuilder(v) {
  const card = $("builderCard");
  const show = !v.over && v.toAct === me && v.phaseName === "거래"
    && !v.pending && v.players.length > 1;
  if (!show) { card.classList.add("hide"); return; }
  card.classList.remove("hide");
  const key = `${gid}:${v.toAct}:${v.phaseName}`;
  if (key !== builderKey) {
    builderKey = key;
    sel = { to: null, giveHand: new Set(), giveFace: new Set(), get: [] };
  }
  renderTradeTo(v);
  renderGiveOpts(v);
  renderGetOpts();
  renderGetBasket();
}

function renderTradeTo(v) {
  const toSel = $("tradeTo"); toSel.innerHTML = "";
  v.players.forEach((p) => {
    if (p.index === me) return;
    const o = document.createElement("option");
    o.value = p.index; o.textContent = `${pName(p.index)} (손패 ${p.handCount}장)`;
    toSel.appendChild(o);
  });
  if (sel.to == null) sel.to = v.players.find((p) => p.index !== me).index;
  toSel.value = sel.to;
  toSel.onchange = () => { sel.to = parseInt(toSel.value, 10); };
}

function renderGiveOpts(v) {
  const box = $("giveOpts"); box.innerHTML = "";
  const meP = v.players[me];
  (meP.hand || []).forEach((b, i) => {
    const s = beanPill(b, i); s.classList.add("click");
    if (sel.giveHand.has(i)) s.classList.add("sel");
    s.onclick = () => {
      sel.giveHand.has(i) ? sel.giveHand.delete(i) : sel.giveHand.add(i);
      renderGiveOpts(v);
    };
    box.appendChild(s);
  });
  (v.faceUp || []).forEach((b, i) => {
    const s = beanPill(b); s.classList.add("click"); s.title = "공개 카드";
    s.style.borderStyle = "dashed"; s.style.borderWidth = "2px";
    if (sel.giveFace.has(i)) s.classList.add("sel");
    s.onclick = () => {
      sel.giveFace.has(i) ? sel.giveFace.delete(i) : sel.giveFace.add(i);
      renderGiveOpts(v);
    };
    box.appendChild(s);
  });
  if (!(meP.hand || []).length && !(v.faceUp || []).length)
    box.innerHTML = '<span class="muted">줄 카드가 없습니다</span>';
}

function renderGetOpts() {
  const box = $("getOpts"); box.innerHTML = "";
  CAT.forEach((info, b) => {
    const s = beanPill(b); s.classList.add("click");
    s.onclick = () => { sel.get.push(b); renderGetBasket(); };
    box.appendChild(s);
  });
}

function renderGetBasket() {
  const box = $("getBasket"); box.innerHTML = "";
  if (!sel.get.length) { box.innerHTML = '<span class="muted">없음 (기부만 하려면 비워 두기)</span>'; return; }
  sel.get.forEach((b, i) => {
    const s = beanPill(b); s.classList.add("click"); s.title = "눌러서 빼기";
    s.onclick = () => { sel.get.splice(i, 1); renderGetBasket(); };
    box.appendChild(s);
  });
}

function sendProposal() {
  $("buildErr").textContent = "";
  if (sel.to == null) { $("buildErr").textContent = "상대를 고르세요."; return; }
  const giveHand = [...sel.giveHand].map((i) => VIEW.players[me].hand[i]);
  const giveFaceUp = [...sel.giveFace].map((i) => VIEW.faceUp[i]);
  const getHand = sel.get.slice();
  if (giveHand.length + giveFaceUp.length + getHand.length === 0) {
    $("buildErr").textContent = "줄 카드나 받을 콩을 하나 이상 고르세요."; return;
  }
  send({ kind: 5, player: me, to: sel.to, giveHand, giveFaceUp, getHand });
  sel.giveHand.clear(); sel.giveFace.clear(); sel.get = [];
}

function renderPlayers(v) {
  const box = $("players_"); box.innerHTML = "";
  v.players.forEach((p) => {
    const el = document.createElement("div");
    el.className = "player" + (p.index === me ? " you" : "") + (p.index === v.toAct && !v.over ? " turn" : "");
    let tags = "";
    if (p.index === me) tags += '<span class="tag you">나</span>';
    if (isBot(p.index)) tags += ' <span class="tag bot">봇</span>';
    if (p.index === v.toAct && !v.over) tags += ' <span class="tag turn">차례</span>';
    const head = `<div class="pname"><span>${pName(p.index)} · 코인 ${p.coins} · 손패 ${p.handCount}장</span><span>${tags}</span></div>`;
    const fields = '<div class="fields">' + p.fields.map(fieldHTML).join("") + "</div>";
    el.innerHTML = head + fields;
    box.appendChild(el);
  });
}

function fieldHTML(f) {
  if (!f.count) return '<div class="field empty">빈 밭</div>';
  const c = coinsFor(f.bean, f.count);
  const nx = nextTier(f.bean, f.count);
  const hint = nx ? `+${nx.need}장 → ${nx.coins}코인` : "최대치";
  return `<div class="field" style="background:${beanColor(f.bean)}" title="${meterText(f.bean)}">`
    + `${beanName(f.bean)}<div class="cnt">${f.count}</div>`
    + `<div class="coin">지금 ${c}코인</div>`
    + `<div class="next">${hint}</div></div>`;
}

function renderScores(v) {
  if (!v.scores) return;
  let best = -1, win = 0;
  v.scores.forEach((s, i) => { if (s > best) { best = s; win = i; } });
  const box = $("actions");
  box.innerHTML = `<div class="win">🏆 승자: ${pName(win)} (${best}코인)</div>`
    + '<div class="muted">' + v.scores.map((s, i) => `${pName(i)} ${s}코인`).join(" · ") + "</div>";
}

// 콩미터 표를 한 번 그린다. 도감은 게임 내내 안 바뀌므로 처음에 한 번이면 된다.
function renderMeterTable() {
  const box = $("meterTable");
  if (!box || !CAT.length) return;
  let html = '<table class="meter"><thead><tr><th>콩</th>'
    + '<th>1코인</th><th>2코인</th><th>3코인</th><th>4코인</th><th>덱</th></tr></thead><tbody>';
  CAT.forEach((info, b) => {
    const cells = info.meter.map((n) => `<td>${n ? n + "장" : "–"}</td>`).join("");
    html += `<tr><td><span class="bean" style="background:${beanColor(b)}">${info.name}</span></td>`
      + `${cells}<td>${info.count}장</td></tr>`;
  });
  box.innerHTML = html + "</tbody></table>";
}

// 시작: 도감을 한 번 받아 두고 로비 버튼을 건다.
(async function init() {
  try { CAT = await (await fetch("catalog")).json(); } catch (e) {}
  renderMeterTable();
  $("btnNew").onclick = createGame;
  $("btnJoin").onclick = () => {
    const code = $("joinCode").value.trim().toUpperCase();
    if (code) joinRoom(code);
  };
  $("btnChat").onclick = sendChat;
  $("chatText").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
  $("btnPropose").onclick = sendProposal;
  $("btnClearTrade").onclick = () => {
    sel.giveHand.clear(); sel.giveFace.clear(); sel.get = [];
    if (VIEW) renderBuilder(VIEW);
  };
  offerResume();
})();

// 저장된 세션이 있으면 "이어서 하기"를 띄운다(새 자리를 잡지 않고 토큰만 재사용).
function offerResume() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch (e) {}
  if (!saved || !saved.code || saved.token == null) return;
  const box = $("resumeBox");
  box.classList.remove("hide");
  box.innerHTML = `<button class="ghost" id="btnResume">이어서 하기 (방 ${saved.code}, ${saved.player}번)</button> `
    + `<button class="ghost" id="btnForget">지우기</button>`;
  $("btnResume").onclick = () => {
    gid = saved.code; me = saved.player; token = saved.token;
    setAuthCookie(saved.token);
    $("lobby").classList.add("hide");
    $("game").classList.remove("hide");
    $("hdrInfo").textContent = `방 ${saved.code} · 나는 ${saved.player}번`;
    connect();
  };
  $("btnForget").onclick = () => {
    localStorage.removeItem(SKEY); clearAuthCookie(); box.classList.add("hide");
  };
}
</script>
</body>
</html>
