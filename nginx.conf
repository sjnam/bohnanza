# 보난자 프런트 nginx: 정적 파일은 직접, 동적 API는 앱 컨테이너로.

upstream bohnanza_app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # 정적 파일은 nginx가 직접 낸다: index.html과 (향후) 이미지 등.
    root /usr/share/nginx/html;
    index index.html;

    # 정적 파일이 있으면 그것을 내고, 없으면 @app으로 넘긴다. 이 한 규칙 덕에
    # 서버에 API 길이 새로 생겨도 여기 경로 목록을 손볼 필요가 없다.
    location / {
        try_files $uri $uri/ @app;
    }

    # SSE 스트림만 예외로 따로 둔다: 버퍼링을 끄고 연결을 오래 열어 둬야 실시간
    # 밀어내기가 막히지 않는다(정적 파일일 리 없으니 곧장 앱으로 보낸다).
    location = /stream {
        proxy_pass http://bohnanza_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 정적으로 못 찾은 나머지는 모두 앱으로 넘긴다(토큰 머리글·쿠키는 기본 전달).
    location @app {
        proxy_pass http://bohnanza_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
