# 보난자 프런트 nginx: 정적 파일은 직접, 동적 API는 앱 컨테이너로.

upstream bohnanza_app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # 정적 파일은 nginx가 직접 낸다: index.html과 (향후) 이미지 등.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # SSE 스트림: 버퍼링을 끄고 연결을 오래 열어 둔다(안 그러면 실시간 밀어내기가 막힌다).
    location = /stream {
        proxy_pass http://bohnanza_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 나머지 동적 API는 앱으로 넘긴다(토큰 머리글·쿠키는 기본으로 그대로 전달된다).
    location ~ ^/(games|action|chat|view|catalog)(/|$) {
        proxy_pass http://bohnanza_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
